<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bus ETA Chevalier Garden Bus Terminal Westbound</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #16191d;
    --card-border: #23272c;
    --text: #f2f3f5;
    --sub: #9aa0a6;
    --accent: #ffcc00;
    --urgent: #ff5a4e;
    --soon: #ffcc00;
    --ok: #4cd97b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100vh;
  }
  header {
    padding: 20px 4px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .status-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    color: var(--text);
    padding: 2px 4px 14px;
    flex-wrap: wrap;
  }
  .status-line .temp { color: var(--accent); }
  .status-line .sep { color: var(--sub); font-weight: 400; }
  .status-line .warn-tag {
    font-size: 14px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.3px;
  }
  .status-line .warn-icon { height: 26px; width: auto; display: block; }
  .status-line .warn-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #updated { font-size: 18px; color: var(--sub); }
  .updated-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .refresh-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 16px;
    flex-shrink: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .route {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
  }
  .dest {
    font-size: 24px;
    color: var(--sub);
    text-align: right;
    max-width: 65%;
  }
  .etas {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .eta-pill {
    background: #1e2227;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 36px;
    font-weight: 600;
    min-width: 54px;
    text-align: center;
  }
  .eta-pill span { display: block; font-size: 36px; font-weight: 400; color: var(--sub); }
  .urgent { color: var(--urgent); }
  .soon { color: var(--soon); }
  .ok { color: var(--ok); }
  .error { color: var(--urgent); font-size: 24px; }
</style>
</head>
<body>
<header>
  <h1>🚌 Bus ETA Chevalier Garden Bus Terminal Westbound</h1>
</header>
<div class="status-line" id="statusLine">
  <span id="clock">--:--:--</span>
  <span class="sep">·</span>
  <span id="temp" class="temp">--°</span>
  <span class="sep warn-sep" id="warnSep" style="display:none;">·</span>
  <span class="warn-tags" id="warnTags"></span>
</div>
<div class="updated-row">
  <div id="updated">Loading…</div>
  <button class="refresh-btn" onclick="loadAll()">Refresh now</button>
</div>
<div id="cards" style="margin-top:14px;"></div>

<script>
const ROUTES = [
  { route: "85K", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/C81CBD93FB2B5C60/85K/1" },
  { route: "84M", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/36D7B643B6B5680A/84M/2" },
  { route: "81C", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/F508350699744D24/81C/1" },
  { route: "43X", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/D2C5873747260F13/43X/1" },
  { route: "299X", url: "https://data.etabus.gov.hk/v1/transport/kmb/eta/1CF4AE2F7045B848/299X/1" },
];

function minutesUntil(isoString) {
  const diffMs = new Date(isoString).getTime() - Date.now();
  return Math.max(0, Math.round(diffMs / 60000));
}

function urgencyClass(mins) {
  if (mins <= 3) return "urgent";
  if (mins <= 8) return "soon";
  return "ok";
}

async function fetchRoute(r) {
  try {
    const res = await fetch(r.url, { cache: "no-store" });
    const json = await res.json();
    const data = (json.data || []).filter(d => d.eta);
    return { ...r, data, error: null };
  } catch (e) {
    return { ...r, data: [], error: "Couldn't load" };
  }
}

async function loadAll() {
  document.getElementById("updated").textContent = "Updating…";
  const results = await Promise.all(ROUTES.map(fetchRoute));
  render(results);
  document.getElementById("updated").textContent =
    "Updated " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function render(results) {
  const container = document.getElementById("cards");
  container.innerHTML = results.map(r => {
    if (r.error) {
      return `<div class="card"><div class="card-top"><div class="route">${r.route}</div></div><div class="error">${r.error}</div></div>`;
    }
    if (!r.data.length) {
      return `<div class="card"><div class="card-top"><div class="route">${r.route}</div></div><div class="error">No buses currently in service</div></div>`;
    }
    const dest = r.data[0].dest_en || "";
    const pills = r.data.slice(0, 3).map(d => {
      const rawMins = minutesUntil(d.eta);
      // data.gov.hk's KMB feed tends to run ~1 min later than the official KMB app; adjust to match.
      const mins = (r.operator === "kmb" || !r.operator) ? Math.max(0, rawMins - 1) : rawMins;
      const cls = urgencyClass(mins);
      const label = mins === 0 ? "Due" : mins + " min";
      return `<div class="eta-pill ${cls}">${label}<span>${new Date(d.eta).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</span></div>`;
    }).join("");
    return `<div class="card">
      <div class="card-top">
        <div class="route">${r.route}</div>
        <div class="dest">${dest}</div>
      </div>
      <div class="etas">${pills}</div>
    </div>`;
  }).join("");
}

loadAll();
setInterval(loadAll, 30000); // auto-refresh every 30s

// --- Clock: Hong Kong time, 12-hour format, digits and signs only ---
function updateClock() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Hong_Kong",
    hour12: false,
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  }).formatToParts(new Date());
  const get = (t) => parts.find(p => p.type === t).value;
  let h = parseInt(get("hour"), 10) % 12;
  if (h === 0) h = 12;
  document.getElementById("clock").textContent = `${h}:${get("minute")}:${get("second")}`;
}
updateClock();
setInterval(updateClock, 1000);

// --- Temperature (Sha Tin) ---
async function updateTemperature() {
  try {
    const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en", { cache: "no-store" });
    const json = await res.json();
    const entry = (json.temperature && json.temperature.data || []).find(d => d.place === "Sha Tin");
    document.getElementById("temp").textContent = entry ? `${entry.value}°${entry.unit}` : "--°";
  } catch (e) {
    console.error("Temperature fetch failed", e);
  }
}

// --- Active warning signals: try HKO's real icons, fall back to a colour-matched text badge ---
const WARNING_LABELS = {
  WFIREY: "Fire Y", WFIRER: "Fire R",
  WFROST: "Frost",
  WHOT: "Hot",
  WCOLD: "Cold",
  WMSGNL: "Monsoon",
  WRAINA: "Rain A", WRAINR: "Rain R", WRAINB: "Rain B",
  WFNTSA: "Flood NT",
  WL: "Landslip",
  TC1: "T1", TC3: "T3", TC8NE: "T8 NE", TC8SE: "T8 SE", TC8NW: "T8 NW", TC8SW: "T8 SW", TC9: "T9", TC10: "T10",
  WTMW: "Tsunami",
  WTS: "Thunder",
};

// Filenames as used at https://www.hko.gov.hk/en/wxinfo/dailywx/warnlegend.htm
const WARNING_ICON_BASE = "https://www.hko.gov.hk/en/wxinfo/dailywx/images/";
const WARNING_ICON_FILES = {
  WFIREY: "firey.gif", WFIRER: "firer.gif",
  WFROST: "frost.gif",
  WHOT: "vhot.gif",
  WCOLD: "cold.gif",
  WMSGNL: "sms.gif",
  WRAINA: "raina.gif", WRAINR: "rainr.gif", WRAINB: "rainb.gif",
  WFNTSA: "ntfl.gif",
  WL: "landslip.gif",
  TC1: "tc1.gif", TC3: "tc3.gif",
  TC8NE: "tc8ne.gif", TC8SE: "tc8b.gif", TC8SW: "tc8c.gif", TC8NW: "tc8d.gif",
  TC9: "tc9.gif", TC10: "tc10.gif",
  WTMW: "tsunami-warn.gif",
  WTS: "ts.gif",
};

// Fallback badge colours, matched to each signal's real-world colour (per HKO convention)
const WARNING_COLORS = {
  WFIREY: { bg: "#ffcc00", fg: "#1a1400" }, WFIRER: { bg: "#e2231a", fg: "#fff" },
  WFROST: { bg: "#8fd6ff", fg: "#00263d" },
  WHOT:   { bg: "#ff7a1a", fg: "#2b0e00" },
  WCOLD:  { bg: "#3b7dd8", fg: "#fff" },
  WMSGNL: { bg: "#2e9e8f", fg: "#fff" },
  WRAINA: { bg: "#ffbf00", fg: "#1a1400" },
  WRAINR: { bg: "#e2231a", fg: "#fff" },
  WRAINB: { bg: "#000000", fg: "#fff" },
  WFNTSA: { bg: "#3b7dd8", fg: "#fff" },
  WL:     { bg: "#8a5a2b", fg: "#fff" },
  TC1: { bg: "#000000", fg: "#fff" }, TC3: { bg: "#000000", fg: "#fff" },
  TC8NE: { bg: "#000000", fg: "#fff" }, TC8SE: { bg: "#000000", fg: "#fff" },
  TC8SW: { bg: "#000000", fg: "#fff" }, TC8NW: { bg: "#000000", fg: "#fff" },
  TC9: { bg: "#000000", fg: "#fff" }, TC10: { bg: "#000000", fg: "#fff" },
  WTMW: { bg: "#7a3bd8", fg: "#fff" },
  WTS:  { bg: "#ffcc00", fg: "#1a1400" },
};

function warnFallbackHTML(code) {
  const label = WARNING_LABELS[code] || code;
  const c = WARNING_COLORS[code] || { bg: "var(--sub)", fg: "#000" };
  return `<span class="warn-tag" style="background:${c.bg};color:${c.fg};">${label}</span>`;
}

function handleWarnIconError(imgEl, code) {
  imgEl.outerHTML = warnFallbackHTML(code);
}

function warnIconHTML(code) {
  const file = WARNING_ICON_FILES[code];
  if (!file) return warnFallbackHTML(code);
  return `<img class="warn-icon" src="${WARNING_ICON_BASE}${file}" alt="${code}" onerror="handleWarnIconError(this, '${code}')">`;
}

// Heat Stress at Work Warning (issued by Labour Department, separate feed — no official small icon, always shown as a text badge)
const HSWW_STYLE = {
  AMBER: { bg: "#ffcc00", fg: "#000000", label: "Work" },
  RED:   { bg: "#e2231a", fg: "#ffffff", label: "Work" },
  BLACK: { bg: "#000000", fg: "#ffffff", label: "Work" },
};

async function fetchWarnsumTags() {
  const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en", { cache: "no-store" });
  const json = await res.json();
  const active = Object.values(json).filter(w => w && w.code && w.actionCode !== "CANCEL");
  return active.map(w => warnIconHTML(w.code));
}

async function fetchHswwTags() {
  const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/hsww.php?lang=en", { cache: "no-store" });
  const json = await res.json();
  // Don't assume the exact top-level key name (docs are inconsistent on this) —
  // find whichever value looks like an HSWW record instead.
  const hsww = Object.values(json).find(v => v && typeof v === "object" && v.warningLevel && v.actionCode);
  if (!hsww || hsww.actionCode !== "ISSUE") return [];
  const style = HSWW_STYLE[hsww.warningLevel] || { bg: "var(--sub)", fg: "#000", label: "Work" };
  return [`<span class="warn-tag" style="background:${style.bg};color:${style.fg};">${style.label}</span>`];
}

async function updateWarnings() {
  try {
    const [warnsumTags, hswwTags] = await Promise.all([
      fetchWarnsumTags().catch(e => { console.error("warnsum fetch failed", e); return []; }),
      fetchHswwTags().catch(e => { console.error("hsww fetch failed", e); return []; }),
    ]);
    const allTags = [...warnsumTags, ...hswwTags];
    const tagsEl = document.getElementById("warnTags");
    const sepEl = document.getElementById("warnSep");
    if (allTags.length) {
      tagsEl.innerHTML = allTags.join("");
      sepEl.style.display = "";
    } else {
      tagsEl.innerHTML = "";
      sepEl.style.display = "none";
    }
  } catch (e) {
    console.error("Warning signal fetch failed", e);
  }
}

updateTemperature();
updateWarnings();
setInterval(updateTemperature, 5 * 60 * 1000);
setInterval(updateWarnings, 5 * 60 * 1000);
</script>
</body>
</html>
